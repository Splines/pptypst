<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>PPTypst</title>
    <link href="data:image/x-icon;," rel="icon">
    <link href="styles/main.css" rel="stylesheet">
    <link href="styles/file-dropzone.css" rel="stylesheet">
    <link href="styles/status-bar.css" rel="stylesheet">
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>

  <body>
    <div class="controls">
      <div class="control-group">
        <label for="fontSize" title="Font size in points (pt)">Size</label>
        <input id="fontSize" type="number" min="1" step="1.0" value="28">
      </div>
      <div class="control-group checkbox-group fill-color-group">
        <label title="Shape fill color">
          <input id="fillColorEnabled" type="checkbox" checked>
          <span>Fill</span>
        </label>
        <!-- eslint-disable-next-line @html-eslint/use-baseline -->
        <input id="fillColor" type="color" value="#000000">
      </div>
      <div class="control-group checkbox-group">
        <label title="Use Typst document colors in preview instead of overriding them">
          <input id="previewFillEnabled" type="checkbox">
          <span>Preview Typst Fill</span>
        </label>
      </div>
      <div class="control-group checkbox-group">
        <label title="Automatically wrap your input in display math delimiters ($)">
          <input id="mathModeEnabled" type="checkbox" checked>
          <span>Only Math</span>
        </label>
      </div>
    </div>
    <div id="inputWrapper">
      <div id="mathDelimiterTop" class="math-delimiter">$</div>
      <textarea id="typstInput" placeholder="Enter Typst code, e.g. a^2 + b^2 = c^2"></textarea>
      <div id="mathDelimiterBottom" class="math-delimiter">$</div>
    </div>

    <div id="previewContainer">
      <span id="previewLabel">Preview</span>
      <button
        id="previewCopyBtn"
        type="button"
        class="preview-copy-btn"
        aria-label="Copy preview SVG"
        disabled
        hidden
        title="Copy preview SVG (shift-click to copy with inverted colors)"
      >
        <!-- noun-copy-7535222 -->
        <svg class="preview-copy-icon-clipboard" version="1.1" viewBox="280 280 660 640" xmlns="http://www.w3.org/2000/svg">
          <path d="m439.69 279.61c-24.469 0-45.984 13.875-56.672 34.312-4.6406 8.7656-1.2656 19.641 7.5 24.281 8.8125 4.5938 19.641 1.2188 24.281-7.5469 4.6875-8.9062 13.875-14.953 24.891-14.953h416.63c15.844 0 28.078 12.141 28.078 27.984v416.68c0 10.547-5.625 19.359-13.875 24.188h-0.046876c-8.5781 5.0156-11.484 16.031-6.4688 24.609 2.3906 4.125 6.375 7.125 10.969 8.3438 4.6406 1.2188 9.5625 0.5625 13.688-1.875 19.031-11.109 31.734-31.828 31.734-55.266v-416.68c0-35.156-28.875-64.078-64.078-64.078zm-82.547 96c-42.609 0-77.531 34.922-77.531 77.531v389.72c0 42.609 34.922 77.438 77.531 77.438h389.72c42.609 0 77.438-34.828 77.438-77.438v-389.72c0-42.609-34.828-77.531-77.438-77.531zm0 36.047h389.72c23.297 0 41.484 18.188 41.484 41.484v389.72c0 23.297-18.188 41.484-41.484 41.484h-389.72c-23.297 0-41.484-18.188-41.484-41.484v-389.72c0-23.297 18.188-41.484 41.484-41.484z" />
        </svg>
        <!-- noun-tick-1296920 -->
        <svg class="preview-copy-icon-tick" version="1.1" viewBox="444 486 300 252" xmlns="http://www.w3.org/2000/svg">
          <path d="m474.31 616.87c-7.2539-6.7969-18.645-6.4297-25.445 0.82031-6.7969 7.2539-6.4297 18.645 0.82031 25.445l96 90c7.7305 7.2461 20.016 6.2812 26.52-2.082l168-216c6.1055-7.8477 4.6914-19.156-3.1562-25.258-7.8477-6.1055-19.156-4.6914-25.258 3.1562l-155.88 200.42z" />
        </svg>
      </button>
      <div id="previewContent"></div>
    </div>

    <div id="diagnosticsContainer" style="display: none;">
      <span id="diagnosticsLabel">Diagnostics</span>
      <div id="diagnosticsContent"></div>
    </div>

    <button id="insertBtn" disabled></button>
    <button id="bulkUpdateBtn" style="display: none;">Update font size</button>

    <div class="file-dropzone">
      <div class="dropzone-container">
        <label id="dropzoneLabel" class="dropzone-label"
          alt="Select a Typst file to generate an equation from it">
          <div class="dropzone-icon">📁</div>
          <div class="dropzone-text">Drop a Typst file here</div>
          <div class="dropzone-subtext">or click to browse</div>
          <input id="fileInput" type="file" class="dropzone-input" accept=".typ,.txt">
        </label>

        <div id="fileInfo" class="file-info">
          <div class="file-icon">📄</div>
          <div id="fileName"></div>
        </div>

        <button id="generateFromFileBtn" style="display: none;"></button>
      </div>
    </div>

    <details id="preambleDetails" class="preamble-panel">
      <summary id="preambleSummary" class="preamble-summary" title="Used for new Typst shapes. Existing shapes keep their own preamble until you update them.">
        Global preamble
      </summary>
      <textarea
        id="preambleInput"
        placeholder="Put your preamble here, e.g. frequently used packages, macro definitions, etc."
        spellcheck="false"
      ></textarea>
    </details>

    <!-- Status Bar -->
    <div id="statusBar" class="status-bar">
      <div id="status" class="status-text"></div>
      <div class="status-bar-controls">
        <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle theme" title="Toggle dark/light mode">
          <svg class="icon-sun" height="18" viewBox="0 0 24 24" width="18">
            <circle cx="12" cy="12" fill="currentcolor" r="5" />
            <line
              stroke="currentcolor"
              stroke-width="2"
              x1="12"
              x2="12"
              y1="1"
              y2="3"
            />
            <line
              stroke="currentcolor"
              stroke-width="2"
              x1="12"
              x2="12"
              y1="21"
              y2="23"
            />
            <line
              stroke="currentcolor"
              stroke-width="2"
              x1="4.22"
              x2="5.64"
              y1="4.22"
              y2="5.64"
            />
            <line
              stroke="currentcolor"
              stroke-width="2"
              x1="18.36"
              x2="19.78"
              y1="18.36"
              y2="19.78"
            />
            <line
              stroke="currentcolor"
              stroke-width="2"
              x1="1"
              x2="3"
              y1="12"
              y2="12"
            />
            <line
              stroke="currentcolor"
              stroke-width="2"
              x1="21"
              x2="23"
              y1="12"
              y2="12"
            />
            <line
              stroke="currentcolor"
              stroke-width="2"
              x1="4.22"
              x2="5.64"
              y1="19.78"
              y2="18.36"
            />
            <line
              stroke="currentcolor"
              stroke-width="2"
              x1="18.36"
              x2="19.78"
              y1="5.64"
              y2="4.22"
            />
          </svg>
          <svg class="icon-moon" height="18" viewBox="0 0 24 24" width="18">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentcolor" />
          </svg>
        </button>
        <a id="aboutLink" class="about-link" href="#" title="About">About</a>
      </div>
    </div>

    <!-- About Modal -->
    <div id="aboutModal" class="modal">
      <div class="modal-content">
        <button id="aboutModalClose" class="modal-close" aria-label="Close about dialog">
          &times;
        </button>
        <h2>About PPTypst</h2>
        <div class="modal-links">
          <a href="https://splines.github.io/pptypst/" rel="noopener noreferrer" target="_blank">
            🌐 Visit Website
          </a>
          <a href="https://github.com/splines/pptypst/issues" rel="noopener noreferrer" target="_blank">
            🐛 Report a Problem
          </a>
          <a href="privacy.html" target="_blank">
            🔒 Privacy Policy
          </a>
        </div>
      </div>
    </div>

    <script type="module" defer src="src/main.js"></script>
  </body>

</html>
